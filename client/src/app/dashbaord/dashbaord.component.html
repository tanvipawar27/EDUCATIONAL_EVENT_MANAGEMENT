<div class="dashboard-container">
  <div class="welcome-banner">
    <h2>Welcome, {{userName}} 👋</h2>
    <p>Manage educational events, resources, and registrations from one place.</p>
  </div>

  <div class="row">
    <!-- Create Event -->
    <div class="col-md-4" *ngIf="roles==='INSTITUTION'">
      <div class="circle-card" routerLink="/create-event" style="background-image: url('assets/create-event.jpg');">
        <h5>Create Event</h5>
      </div>
    </div>

    <!-- Add Resource -->
    <div class="col-md-4" *ngIf="roles==='EDUCATOR' || roles==='INSTITUTION'">
      <div class="circle-card" routerLink="/add-resource" style="background-image: url('assets/add-resource.jpg');">
        <h5>Add Resource</h5>
      </div>
    </div>

    <!-- Allocate Resources -->
    <div class="col-md-4" *ngIf="roles==='INSTITUTION'">
      <div class="circle-card" routerLink="/resource-allocate" style="background-image: url('assets/allocate-bg.jpg');">
        <h5>Allocate Resources</h5>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- View Events -->
    <div class="col-md-4" *ngIf="roles==='EDUCATOR' || roles==='INSTITUTION'">
      <div class="circle-card" routerLink="/view-events" style="background-image: url('assets/view-events.jpg');">
        <h5>View Events</h5>
      </div>
    </div>

    <!-- Register for Event -->
    <div class="col-md-4" *ngIf="roles==='STUDENT' || roles==='INSTITUTION'">
      <div class="circle-card" routerLink="/register-for-event" style="background-image: url('assets/register-bg.jpg');">
        <h5>Register</h5>
      </div>
    </div>

    <!-- My Bookings -->
    <div class="col-md-4" *ngIf="roles==='STUDENT' || roles==='INSTITUTION'">
      <div class="circle-card" routerLink="/booking-details" style="background-image: url('assets/bookings-bg.jpg');">
        <h5>My Bookings</h5>
      </div>
    </div>
  </div>
</div>
