<div class="dashboard-container">
  <div class="welcome-banner">
    <h2>Welcome, {{userName}} 👋</h2>
    <p>Manage educational events, resources, and registrations from one place.</p>
  </div>

    <!-- View Events -->
  <div class="col-md-4">
    <div class="circle-card" routerLink="/view-events" style="background-image: url('assets/view-events.jpg');">
      <h5>View Events</h5>
    </div>
  </div>

 <!-- view resources -->
  <div class="col-md-4" *ngIf="roles==='INSTITUTION'">
    <div class="circle-card" routerLink="/view-resource" style="background-image: url('assets/add-resource.jpg');">
      <h5>View Resource</h5>
    </div>
  </div>

  <!-- Allocate Resources -->
  <div class="col-md-4" *ngIf="roles==='INSTITUTION'">
    <div class="circle-card" routerLink="/view-students" style="background-image: url('assets/allocate-bg.jpg');">
      <h5>View Students</h5>
    </div>
  </div>
  <!-- Allocate Resources -->
  <div class="col-md-4" *ngIf="roles==='INSTITUTION'">
    <div class="circle-card" routerLink="/view-educators" style="background-image: url('assets/allocate-bg.jpg');">
      <h5>View Educators</h5>
    </div>
  </div>

  <!-- Register for Event -->
  <!-- <div class="col-md-4" *ngIf="roles==='STUDENT'">
    <div class="circle-card" routerLink="/register-for-event" style="background-image: url('assets/register-bg.jpg');">
      <h5>Register</h5>
    </div>
  </div>-->

  <!-- My Bookings -->
  <div class="col-md-4" *ngIf="roles==='STUDENT'">
    <div class="circle-card" routerLink="/booking-details" style="background-image: url('assets/bookings-bg.jpg');">
      <h5>My Bookings</h5>
    </div>
  </div> 

  <!-- View Allocation -->
  <div class="col-md-4" *ngIf="roles==='INSTITUTION'">
    <div class="circle-card" routerLink="/view-allocations" style="background-image: url('assets/bookings-bg.jpg');">
      <h5>Allocation</h5>
    </div>
  </div>
</div>
