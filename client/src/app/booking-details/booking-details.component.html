<div class="page-container">

  <!-- Booking Result Card -->
  <div class="card mt-3" *ngIf="eventList && eventList.length > 0">
    <div class="card-header">
      <h3>Booking Information</h3>
    </div>

    <div class="card-body">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col">Sr#</th>
            <th scope="col">Status</th>
            <th scope="col">Event</th>
          </tr>
        </thead>
        <tbody>
         <ng-container *ngFor="let booking of eventList; let i = index">
  <tr *ngIf="booking?.event?.name && booking?.event?.description && booking?.event?.materials">
    <td>{{ i + 1 }}</td>
    <td>{{ booking.status }}</td>
    <td>
      <div><strong>Name:</strong> {{ booking.event?.name }}</div>
      <div><strong>Description:</strong> {{ booking.event?.description }}</div>
      <div><strong>Materials:</strong> {{ booking.event?.materials }}</div>
    </td>
  </tr>
</ng-container>

        </tbody>
      </table>
    </div>
  </div>

  <!-- No Data Message -->
  <div class="alert alert-info mt-3" *ngIf="showMessage && !showError">
    {{ responseMessage }}
  </div>

  <!-- Error Message -->
  <div class="alert alert-danger mt-3" *ngIf="showError">
    {{ errorMessage }}
  </div>

</div>
