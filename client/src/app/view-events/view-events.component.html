<div class="page-container">
  <div class="card" *ngIf="isUpdate">
     <h3>Update: </h3>
    <div class="card-header"><h3>Update Event Material</h3></div>
    <div class="card-body">
     
      <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
        <input type="hidden" formControlName="id" />
        <div class="form-group">
          <label>Event Name</label>
          <input type="text" formControlName="name" class="form-control"
            [class.is-invalid]="itemForm.get('name')?.invalid && itemForm.get('name')?.touched" />
          <div class="invalid-feedback" *ngIf="itemForm.get('name')?.invalid && itemForm.get('name')?.touched">Name is required.</div>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea formControlName="description" class="form-control" rows="3"
            [class.is-invalid]="itemForm.get('description')?.invalid && itemForm.get('description')?.touched"></textarea>
          <div class="invalid-feedback" *ngIf="itemForm.get('description')?.invalid && itemForm.get('description')?.touched">Description is required.</div>
        </div>
        <div class="form-group">
          <label>Materials</label>
          <input type="text" formControlName="materials" class="form-control" />
        </div>
        <div class="alert alert-danger" *ngIf="showError">{{ errorMessage }}</div>
        <div class="alert alert-success" *ngIf="showMessage">{{ responseMessage }}</div>
        <button type="submit" class="btn btn-success">Update Event</button>
        <button type="button" class="btn btn-secondary ml-2" (click)="isUpdate=false">Cancel</button>
      </form>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-header"><h4>Events Agenda</h4></div>
    <table class="table">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Description</th><th>Materials</th><th>Action</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let event of eventList; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ event.name }}</td>
          <td>{{ event.description }}</td>
          <td>{{ event.materials }}</td>
          <td><button class="btn btn-sm btn-warning" (click)="edit(event)">Edit</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
