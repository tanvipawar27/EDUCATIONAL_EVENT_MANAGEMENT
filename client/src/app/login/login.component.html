<div class="landing">
  <div class="content">
    <!-- Pill -->
    <div class="pill">
      <span class="pill__dot"></span>
      <span class="pill__text">Fast • Secure • Role-based</span>
    </div>

    <!-- Title -->
    <h1 class="title">
      Login to <span class="accent">EduSphere</span>
    </h1>
    <p class="subtitle">
      Enter your credentials to access your dashboard.
    </p>

    <!-- Login Form -->
    <form [formGroup]="itemForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter your username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
        />
      </div>

      <div *ngIf="showError" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="actions">
        <button class="button" type="submit">
          <span class="blob1"></span>
          <span class="inner">Login</span>
        </button>

        <button class="button button--secondary" type="button" (click)="registration()">
          <span class="blob1"></span>
          <span class="inner">Register</span>
        </button>
      </div>
    </form>

    <!-- Footer -->
    <footer class="footer">
      <span>© {{ currentYear }} EduSphere</span>
    </footer>
  </div>
</div>
