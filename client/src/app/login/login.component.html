<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>EduTech Platform</h2>
      <p>Sign in to your account</p>
    </div>

    <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
      <!-- Username -->
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          formControlName="username"
          placeholder="Enter username"
          class="form-control"
          [class.is-invalid]="itemForm.get('username')?.invalid && itemForm.get('username')?.touched"
        />
        <div class="invalid-feedback" *ngIf="itemForm.get('username')?.invalid && itemForm.get('username')?.touched">
          Username is required.
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
          class="form-control"
          [class.is-invalid]="itemForm.get('password')?.invalid && itemForm.get('password')?.touched"
        />
        <div class="invalid-feedback" *ngIf="itemForm.get('password')?.invalid && itemForm.get('password')?.touched">
          Password is required.
        </div>
      </div>

      <!-- API Error -->
      <div class="alert alert-danger" *ngIf="showError">
        {{ errorMessage }}
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary btn-block">
        Login
      </button>

      <p class="register-link">
        Don't have an account?
        <a (click)="registration()" style="cursor:pointer;">Register</a>
      </p>
    </form>
  </div>
</div>
