<div class="page-container">
  <div class="card-header text-center mb-4">
    <h3>Resource Allocations</h3>
  </div>

  <!-- Search Bar -->
  <div class="mb-3">
    <input type="text"
           class="form-control"
           placeholder="Search allocations..."
           [(ngModel)]="searchTerm"
           (input)="applySearch()" />
  </div>

  <div class="alert alert-danger" *ngIf="showError">{{ errorMessage }}</div>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let alloc of filteredAllocations; let i = index">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title text-primary">Allocation {{ i + 1 }}</h5>

          <!-- ✅ First show Study Materials -->
          <div *ngIf="alloc.resourceAllocations?.length">
            <strong>Resources Allocated:</strong>
            <div *ngFor="let t of alloc.resourceAllocations; let i=index">
              <p><strong>Allocated Material {{i+1}}:</strong> {{ t.resourceType }}</p>
            </div>
          </div>

          <!-- ✅ Then show Resource Info -->
          <!-- <p><strong></strong> {{ alloc.resourceType }}</p> -->
          <p><strong>Allocated To:</strong> {{ alloc?.name }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
