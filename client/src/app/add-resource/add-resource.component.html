
<div class="page-container">
  <div class="card">
    <div class="card-header"><h3>Add Resource</h3></div>
    <div class="card-body">
      <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Resource Type</label>
          <input type="text" formControlName="resourceType" class="form-control" placeholder="Enter resource type"
            [class.is-invalid]="itemForm.get('resourceType')?.invalid && itemForm.get('resourceType')?.touched" />
          <div class="invalid-feedback" *ngIf="itemForm.get('resourceType')?.invalid && itemForm.get('resourceType')?.touched">
            Resource type is required.
          </div>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea formControlName="description" class="form-control" rows="3" placeholder="Enter description"
            [class.is-invalid]="itemForm.get('description')?.invalid && itemForm.get('description')?.touched"></textarea>
          <div class="invalid-feedback" *ngIf="itemForm.get('description')?.invalid && itemForm.get('description')?.touched">
            Description is required.
          </div>
        </div>
        <div class="form-group">
          <label>Availability</label>
          <input type="text" formControlName="availability" class="form-control" placeholder="Enter availability"
            [class.is-invalid]="itemForm.get('availability')?.invalid && itemForm.get('availability')?.touched" />
          <div class="invalid-feedback" *ngIf="itemForm.get('availability')?.invalid && itemForm.get('availability')?.touched">
            Availability is required.
          </div>
        </div>
        <div class="alert alert-danger" *ngIf="showError">{{ errorMessage }}</div>
        <div class="alert alert-success" *ngIf="showMessage">{{ responseMessage }}</div>
        <button type="submit" class="btn btn-primary">Add Resource</button>
      </form>
    </div>
  </div>
