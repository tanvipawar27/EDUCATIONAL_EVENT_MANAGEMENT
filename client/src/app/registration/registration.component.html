<div class="auth-container">
<div class="auth-card">
<div class="auth-header">
<h2>Create Account</h2>
<p>Register to join EduTech Platform</p>
</div>
<form [formGroup]="itemForm" (ngSubmit)="onRegister()">
<div class="form-group">
<label>Username</label>
<input type="text" formControlName="username" placeholder="Enter username" class="form-control"
          [class.is-invalid]="itemForm.get('username')?.invalid && itemForm.get('username')?.touched" />
<div class="invalid-feedback" *ngIf="itemForm.get('username')?.invalid && itemForm.get('username')?.touched">
          Username is required.
</div>
</div>
<div class="form-group">
<label>Email</label>
<input type="email" formControlName="email" placeholder="Enter email" class="form-control"
          [class.is-invalid]="itemForm.get('email')?.invalid && itemForm.get('email')?.touched" />
<div class="invalid-feedback" *ngIf="itemForm.get('email')?.errors?.['required'] && itemForm.get('email')?.touched">
          Email is required.
</div>
<div class="invalid-feedback" *ngIf="itemForm.get('email')?.errors?.['email'] && itemForm.get('email')?.touched">
          Please enter a valid email.
</div>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" formControlName="password" placeholder="Enter password" class="form-control"
          [class.is-invalid]="itemForm.get('password')?.invalid && itemForm.get('password')?.touched" />
<div class="invalid-feedback" *ngIf="itemForm.get('password')?.invalid && itemForm.get('password')?.touched">
          Password is required.
</div>
</div>
<div class="form-group">
<label>Role</label>
<select formControlName="role" class="form-control"
          [class.is-invalid]="itemForm.get('role')?.invalid && itemForm.get('role')?.touched">
<option value="">Select Role</option>
<option value="INSTITUTION">Institution</option>
<option value="EDUCATOR">Educator</option>
<option value="STUDENT">Student</option>
</select>
<div class="invalid-feedback" *ngIf="itemForm.get('role')?.invalid && itemForm.get('role')?.touched">
          Role is required.
</div>
</div>
<div class="alert alert-info" *ngIf="showMessage">{{ responseMessage }}</div>
<button type="submit" class="btn btn-primary btn-block">Register</button>
<p class="login-link">Already have an account? <a routerLink="/login" style="cursor:pointer;">Login</a></p>
</form>
</div>
</div>
