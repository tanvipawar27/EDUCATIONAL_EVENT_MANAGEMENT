<div class="page-container">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
       <!-- Feedback Messages -->
        <div class="alert alert-danger" *ngIf="showError">{{ errorMessage }}</div>
        <div class="alert alert-success" *ngIf="showMessage">{{ responseMessage }}</div>

      <h3 class="mb-0">Allocate Resource to Event</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
        
        <!-- Event Dropdown -->
        <div class="form-group mb-3">
          <label>Select Event</label>
          <select formControlName="eventId" class="form-control"
            [class.is-invalid]="eventId?.invalid && eventId?.touched">
            <option value="">-- Select Event --</option>
            <option *ngFor="let event of eventList" [value]="event.id">{{ event.name }}</option>
          </select>
          <div class="invalid-feedback" *ngIf="eventId?.invalid && eventId?.touched">
            Event selection is required.
          </div>
        </div>

        <!-- Resource Dropdown -->
        <div class="form-group mb-3">
          <label>Select Resource</label>
          <select formControlName="resourceId" class="form-control"
            [class.is-invalid]="resourceId?.invalid && resourceId?.touched">
            <option value="">-- Select Resource --</option>
            <option *ngFor="let res of resourceList" [value]="res.id">{{ res.resourceType }}</option>
          </select>
          <div class="invalid-feedback" *ngIf="resourceId?.invalid && resourceId?.touched">
            Resource selection is required.
          </div>
        </div>

       
        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">Allocate Resource</button>
      </form>
    </div>
  </div>
</div>
