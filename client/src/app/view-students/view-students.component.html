<div class="page-container">
  <div class="card-header text-center mb-4">
    <h3>All Students</h3>
  </div>

  <!-- Search Bar -->
  <div class="mb-3">
    <input type="text"
           class="form-control"
           placeholder="Search students..."
           [(ngModel)]="searchTerm"
           (input)="applySearch()" />
  </div>

  <!-- Loading state -->
  <div *ngIf="loading" class="text-center">
    <p>Loading students...</p>
  </div>

  <!-- Error state -->
  <div *ngIf="errorMessage" class="alert alert-danger text-center">
    {{ errorMessage }}
  </div>

  <!-- Students table -->
  <table class="table table-striped table-bordered" *ngIf="!loading && !errorMessage">
    <thead class="table">
      <tr>
        <th>S.No.</th>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let student of filteredStudents; let i=index">
        <td>{{ i+1 }}</td>
        <td>{{ student.username }}</td>
        <td>{{ student.email }}</td>
      </tr>
    </tbody>
  </table>
</div>
<app-chatbot></app-chatbot>
