<div class="app-wrapper">
 
  <!-- ================= FLOATING AURORA SIDEBAR ================= -->
<nav class="aurora-sidebar" *ngIf="authService.getLoginStatus && IsLoggin">
 
    <!-- Glow Bulbs -->
<span class="glow-bulb bulb-1"></span>
<span class="glow-bulb bulb-2"></span>
 
    <!-- Brand -->
<div class="sidebar-brand">
<div class="brand-title">EduEvent</div>
<div class="brand-role">{{ roleName }}</div>
</div>
 
    <!-- Navigation -->
<ul class="nav-list">
<li>
<a routerLink="/dashboard" class="nav-item">
<i class="fas fa-home"></i>
<span>Dashboard</span>
</a>
</li>
 
      <li *ngIf="roleName==='INSTITUTION'">
<a routerLink="/create-event" class="nav-item">
<i class="fas fa-calendar-plus"></i>
<span>Add Event</span>
</a>
</li>
 
      <li *ngIf="roleName==='INSTITUTION' || roleName==='EDUCATOR'">
<a routerLink="/add-resource" class="nav-item">
<i class="fas fa-book"></i>
<span>Add Resource</span>
</a>
</li>
 
      <li *ngIf="roleName==='INSTITUTION'">
<a routerLink="/resource-allocate" class="nav-item">
<i class="fas fa-tasks"></i>
<span>Allocate</span>
</a>
</li>
 
      <li *ngIf="roleName==='INSTITUTION' || roleName==='EDUCATOR'">
<a routerLink="/view-events" class="nav-item">
<i class="fas fa-calendar-alt"></i>
<span>View Events</span>
</a>
</li>
 
      <li *ngIf="roleName==='STUDENT'">
<a routerLink="/register-for-event" class="nav-item">
<i class="fas fa-user-check"></i>
<span>Register</span>
</a>
</li>
 
      <li *ngIf="roleName==='STUDENT'">
<a routerLink="/booking-details" class="nav-item">
<i class="fas fa-ticket-alt"></i>
<span>My Bookings</span>
</a>
</li>
</ul>
 
    <!-- Logout -->
<button class="logout-btn" (click)="logout()">Logout</button>
 
  </nav>
 
  <!-- ================= MAIN CONTENT ================= -->
<main class="main-content" [class.full-width]="!IsLoggin" [class.no-margin]="isPublicPage()">>
<router-outlet></router-outlet>
</main>
 
</div>
